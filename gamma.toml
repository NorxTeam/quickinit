schema = "gamma-recipe"
schema_version = 1
status = "staging"

[package]
name = "quickinit"
version = "0.1.0"
release = 1
license = "GPL-3.0-only"
abi = "norx-userspace-abi-v1"
architectures = ["x86_64", "aarch64"]

[source]
kind = "git"
repository = "https://github.com/NorxTeam/quickinit.git"
subdir = "."

[dependencies]
build = ["toolchain = 0.1.0", "rust-userspace = 0.1.0"]

[build]
system = "cargo"
command = "build"
args = ["--locked", "--release"]
network = false

[targets.x86_64]
triple = "x86_64-unknown-norx"

[targets.aarch64]
triple = "aarch64-unknown-norx"

[[outputs]]
name = "quickinit"
kind = "service"
paths = ["bin/quickinit", "cfg/quickinit"]
